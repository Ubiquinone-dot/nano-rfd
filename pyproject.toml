[project]
name = "nanorfd"
version = "0.1.0"
description = "A readable, single-script C-alpha protein diffusion model"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "atomworks>=3.0.4,<4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
